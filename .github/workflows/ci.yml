name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from `packageManager` and Node from
      # `devEngines.runtime` in package.json; installs with a frozen lockfile.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # Single source of truth for the verification gate (package.json
      # `check`): typecheck, lint, format:check, test. Keep this as one
      # step so CI can't drift from the script contributors run locally.
      - run: pnpm check
